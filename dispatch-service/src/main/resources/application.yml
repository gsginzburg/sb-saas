server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DISPATCH_DB_URL:jdbc:postgresql://localhost:5432/dispatch}
    username: ${DISPATCH_DB_USER:dispatch}
    password: ${DISPATCH_DB_PASS:dispatch}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      schema: ${dispatch.schema}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${dispatch.schema}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/dispatch-changelog-master.xml
    default-schema: ${dispatch.schema}
    liquibase-schema: ${dispatch.schema}

dispatch:
  schema: ${DISPATCH_SCHEMA:dispatch}
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-min-256-bits-secret-key-here}
    issuer: dispatch
    backoffice-token-expiry-seconds: 28800     # 8 hours
    exchange-token-expiry-seconds: 300         # 5 minutes
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
  auth:
    provider: ${AUTH_PROVIDER:native}   # native, cognito, firebase
    cognito:
      user-pool-id: ${COGNITO_USER_POOL_ID:}
      region: ${COGNITO_REGION:us-east-1}
    firebase:
      project-id: ${FIREBASE_PROJECT_ID:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
