server:
  port: 8081

spring:
  application:
    name: cluster-sample
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

cluster:
  id: ${CLUSTER_ID:cluster-1}
  name: ${CLUSTER_NAME:Sample Cluster 1}
  dispatch-url: ${DISPATCH_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4201}
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-min-256-bits-secret-key-here}
    issuer: cluster-sample
    session-token-expiry-seconds: 28800
  shards:
    shard-1:
      jdbc-url: ${SHARD1_DB_URL:jdbc:postgresql://localhost:5432/cluster}
      username: ${SHARD1_DB_USER:cluster}
      password: ${SHARD1_DB_PASS:cluster}
      max-pool-size: 20
      min-idle: 5
    shard-2:
      jdbc-url: ${SHARD2_DB_URL:}
      username: ${SHARD2_DB_USER:cluster}
      password: ${SHARD2_DB_PASS:cluster}
      max-pool-size: 20
      min-idle: 5

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
